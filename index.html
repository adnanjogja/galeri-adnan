<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeri Kenangan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,500;1,700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script>/* penanda mode pratinjau (iframe admin) dipasang sebelum render agar tidak ada lonjakan layout */
if(location.hash==='#preview'&&parent!==window)document.documentElement.className='pv';</script>
<style>
.in>*{animation:up 1.3s cubic-bezier(.2,.7,.2,1) backwards}
.in>:nth-child(2){animation-delay:.25s}.in>:nth-child(3){animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(22px);filter:blur(6px)}}
.vbtn{margin:16px 0 26px;display:inline-flex;align-items:center;gap:12px;padding:15px 32px;border-radius:999px;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--gold) 14%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);color:var(--tx);font:600 .95rem 'Montserrat',sans-serif;letter-spacing:.04em;box-shadow:0 8px 32px #0003,inset 0 1px 0 #fff4;transition:transform .5s cubic-bezier(.2,.8,.2,1),background .5s,box-shadow .5s}
.vbtn svg{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linejoin:round;transition:transform .6s}
.vbtn:hover,.vbtn:focus-visible{background:color-mix(in srgb,var(--gold) 24%,transparent);transform:translateY(-3px);box-shadow:0 14px 40px #0004,0 0 0 1px var(--gold),inset 0 1px 0 #fff6}
.vbtn:hover svg{transform:rotate(-8deg) scale(1.12)}
.vbtn:active{transform:translateY(-1px) scale(.98)}
.gh{text-align:center;padding:6px 20px 4px}
.gh h2{font:italic 600 1.7rem 'Playfair Display',serif;margin:0}
.gh small{display:block;color:var(--mut);font-size:.8rem;margin-top:4px}
.gh i{display:block;width:90px;height:1px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
/* ===== Galeri: 2 kolom ala Pinterest (ada gap, kartu bersudut melengkung), tiap kolom hanyut berlawanan arah =====
   JS (build) mengisi .gal dengan 2 .col; tiap .col berisi .trk yang memuat salinan daftar foto berulang.
   .trk digeser tepat sejauh satu salinan (--p) lalu mengulang, jadi putarannya tak terlihat putus.
   --gap = jarak antar kolom sekaligus antar kartu; JS membacanya agar panjang putaran selalu tepat. */
.gal{--gap:10px;position:relative;overflow:hidden;display:grid;grid-template-columns:repeat(2,1fr);column-gap:var(--gap);margin:20px 0 0;padding:0 12px}
.gal::before,.gal::after{content:'';position:absolute;left:0;right:0;z-index:9;pointer-events:none}
.gal::before{top:0;height:46px;background:linear-gradient(var(--bg),transparent)}
/* fade bawah lebih tinggi: foto larut ke latar footer tanpa garis batas */
.gal::after{bottom:0;height:92px;background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 62%,transparent) 55%,var(--bg) 90%)}
.col{position:relative;min-width:0}
.cpy{display:flow-root} /* margin bawah kartu terakhir tetap di dalam salinan, jadi panjang putaran = tinggi satu salinan */
.trk{will-change:transform;animation-timing-function:linear;animation-iteration-count:infinite}
.trk.up{animation-name:up}.trk.dn{animation-name:dn}
@keyframes up{to{transform:translateY(calc(var(--p)*-1))}}
@keyframes dn{from{transform:translateY(calc(var(--p)*-1))}to{transform:translateY(0)}}
.ph{display:block;margin:0 0 var(--gap);border-radius:18px;position:relative;overflow:hidden;background:var(--card);cursor:pointer;animation:pop 1.9s cubic-bezier(.16,.8,.24,1) backwards;animation-delay:calc(var(--d,0)*140ms);transition:transform .7s cubic-bezier(.2,.8,.2,1),box-shadow .7s,filter .7s,opacity .7s;-webkit-tap-highlight-color:transparent}
/* foto muncul melayang naik, membesar pelan, dan menajam */
@keyframes pop{from{opacity:0;transform:translateY(44px) scale(.9);filter:blur(7px)}}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph .broken{height:100%;display:grid;place-items:center}
.col:nth-child(1) .ph{transform-origin:25% 50%}
.col:nth-child(2) .ph{transform-origin:75% 50%}
/* Hover (hanya perangkat dengan kursor): foto yang disorot membesar & mengambang di atas tetangga, kolomnya berhenti sejenak,
   foto lain jadi hitam-putih dan meredup. Di layar sentuh efek ini tidak dipakai (hover menempel setelah ketukan). */
@media(hover:hover) and (pointer:fine){
  .col:hover{z-index:5}
  .col:hover .trk{animation-play-state:paused}
  .ph:is(:hover,:focus-visible){z-index:3;transform:scale(1.22);box-shadow:0 18px 44px #000b,0 0 0 1px color-mix(in srgb,var(--ac) 55%,transparent)}
  .gal:has(.ph:is(:hover,:focus-visible)) .ph:not(:is(:hover,:focus-visible)){filter:grayscale(1) brightness(.72);opacity:.6}
}
/* Nama + pesan: berjalan horizontal sangat pelan di bawah foto (marquee tanpa putus).
   Tiap .mi (satu salinan) minimal selebar kolom (100cqw), jadi dua salinan selalu cukup menutup ruang. */
.cp{position:absolute;left:0;right:0;bottom:0;padding:20px 0 6px;color:#fff;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.mq{container-type:inline-size;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mt{display:flex;width:max-content;animation:mq 30s linear infinite;will-change:transform}
@keyframes mq{to{transform:translateX(-50%)}}
.mi{flex:none;display:flex;align-items:baseline;gap:.75em;min-width:100cqw;padding-right:1.5em;white-space:nowrap;font-size:.62rem;line-height:1.5}
.mi b{color:var(--ac);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.mi i{font-style:normal;font-weight:300;letter-spacing:.02em;color:#fff}
.mi u{text-decoration:none;color:var(--ac);opacity:.65}
/* Pengguna yang meminta gerak dikurangi: tanpa drift & marquee, galeri tampil statis dan utuh */
@media(prefers-reduced-motion:reduce){
  .gal{height:auto!important}
  .gal::before,.gal::after{display:none} /* galeri tidak dipotong, jadi tak perlu fade tepi */
  .trk,.mt{animation:none!important}
  .cpy+.cpy,.mi+.mi{display:none}
  .mi{min-width:0}
}
.msg{text-align:center;color:var(--mut);padding:30px 20px;font-style:italic}
.adm{display:inline-block;margin-top:14px;padding:6px 10px;color:var(--mut);font:italic .85rem 'Playfair Display',serif;text-decoration:none;opacity:.7;transition:.4s}
.adm:hover{color:var(--gold);opacity:1}
.mask{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:12px;background:rgba(5,4,3,.82);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
.mask.on{opacity:1;visibility:visible}
.win{width:min(100%,500px);max-height:100%;overflow:auto;background:radial-gradient(circle at 85% 100%,rgba(212,175,55,.28),transparent 55%),radial-gradient(circle at 0 0,rgba(120,90,200,.16),transparent 50%),#14110c;border:1px solid #4a3d1c;border-radius:20px;padding:14px;box-shadow:0 30px 80px #000;transform:translateY(26px) scale(.94);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.mask.on .win{transform:none}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar b{font:italic 600 1.1rem 'Playfair Display',serif;color:var(--gold)}
.view{--ar:.75;position:relative;overflow:hidden;margin:auto;width:min(100%,calc((100dvh - 350px)*var(--ar)));aspect-ratio:var(--ar);background:#000;border-radius:14px;transition:width .5s,aspect-ratio .5s}
.view.ls{--ar:1.3333}
.view video,.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mir{transform:scaleX(-1)}
.grid{position:absolute;inset:0;pointer-events:none;opacity:0;transition:.3s;background:linear-gradient(90deg,transparent 33%,#fff5 33% calc(33% + 1px),transparent calc(33% + 1px) 66%,#fff5 66% calc(66% + 1px),transparent calc(66% + 1px)),linear-gradient(transparent 33%,#fff5 33% calc(33% + 1px),transparent calc(33% + 1px) 66%,#fff5 66% calc(66% + 1px),transparent calc(66% + 1px))}
.grid.on{opacity:1}
.cd{position:absolute;inset:0;display:grid;place-items:center;font:700 5rem 'Playfair Display',serif;color:#fff;text-shadow:0 2px 20px #000}
.fl2{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.fl2.go{animation:fl .5s}@keyframes fl{from{opacity:.85}}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.tools button{background:#201b12;color:#f5f0e6;border:1px solid #3a3222;border-radius:20px;padding:8px 14px;font-size:.8rem;transition:.3s}
.tools button.on{border-color:var(--gold);color:var(--gold)}
#zoom{width:100%;accent-color:var(--gold)}
.shut{display:grid;place-items:center;padding:6px 0 2px}
.shut button{width:70px;height:70px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(#f5e6b0 0 55%,transparent 57%);transition:transform .2s}
.shut button:active{transform:scale(.9)}
.win[data-s=live] .rev,.win[data-s=live] #pic,.win[data-s=review] .live,.win[data-s=review] video{display:none}
.rev input{width:100%;padding:13px 14px;margin-top:10px;background:rgba(0,0,0,.45);color:#f5f0e6;border:1px solid #3a3528;border-radius:12px;font-size:16px}
.rev input:focus{outline:none;border-color:var(--gold)}
.rev .r{display:flex;gap:10px;margin-top:14px}
.glass{flex:1;min-height:50px;padding:0 18px;border-radius:16px;color:#fff;font-weight:600;letter-spacing:.02em;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.32);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .3s,background .3s,box-shadow .3s}
.glass:hover{background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.1));transform:translateY(-1px)}
.glass:active{transform:scale(.97)}
.glass.p{border-color:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 18px rgba(212,175,55,.3),inset 0 1px 0 rgba(255,255,255,.45)}
.glass:disabled{opacity:.55}
/* Grup lokasi & tanggal: di dalam header, posisi vertikal diatur slider (--ep: 0 = atas header, 100 = bawah header).
   Rumus sama dengan grup teks header, jadi di 0 menempel di tepi atas dan di 100 menempel di tepi bawah. */
.hero .evt{position:absolute;z-index:1;left:0;right:0;top:calc(var(--ep,100)*1%);transform:translateY(calc(var(--ep,100)*-1%));padding:16px 20px 22px;text-align:center}
.evt .orn{margin-bottom:12px}
.hero .orn::before,.hero .orn::after{width:86px} /* tetap, tidak ikut lebar jendela (22vw) agar sama di HP, bingkai, dan pratinjau */
footer{padding:26px 20px calc(30px + env(safe-area-inset-bottom));border-top:0} /* tanpa garis: galeri larut mulus ke footer */
footer .fc{margin-top:0}
/* Pratinjau di admin: layar 390px tanpa scrollbar, jarak atas sama dengan bingkai HP (ruang notch) */
html.pv{--top:40px;scrollbar-width:none}
html.pv::-webkit-scrollbar{display:none}
/* Tampilan default = layar HP. Di tablet/desktop tampil dalam bingkai HP di tengah layar.
   Layar HP di dalam bingkai = 390 x 780 px, identik dengan iframe pratinjau di halaman admin */
@media(min-width:700px) and (min-height:560px){
html{background:var(--ob2);--top:40px}
body{height:100dvh;overflow:hidden;display:grid;place-items:center;background:transparent}
body::before{content:'';position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 18% 22%,color-mix(in srgb,var(--ac) 70%,var(--ob)),transparent 48%),radial-gradient(circle at 82% 78%,color-mix(in srgb,var(--ac) 45%,var(--ob)),transparent 52%),radial-gradient(circle at 75% 12%,color-mix(in srgb,var(--ac) 30%,var(--ob)),transparent 42%);filter:blur(55px)}
.phone{position:relative;width:408px;height:min(798px,94dvh);padding:9px;border-radius:50px;background:#0a0a0a;box-shadow:0 0 0 2px #2c2c2c,0 0 0 5px #131313,0 40px 100px #0008;transform:translateZ(0)}
.phone::after{content:'';position:absolute;top:19px;left:50%;width:92px;height:24px;margin-left:-46px;border-radius:14px;background:#000;z-index:80;pointer-events:none}
.scr{height:100%;overflow-y:auto;overflow-x:hidden;border-radius:42px;background:var(--bg);scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.mask,.lb{inset:9px;border-radius:42px}
}
</style>
</head>
<body>
<div class="phone"><div class="scr" id="scr">
<header class="hero">
  <div class="hbg"></div><div class="shade"></div>
  <i class="sp" id="sp1"></i>
  <div class="in">
    <p class="eb" data-k="eyebrow">The Wedding Of</p>
    <h1 data-k="title">You &amp; Me</h1>
    <p class="sub" data-k="sub">Abadikan momen indah bersama kami</p>
  </div>
  <i class="sp" id="sp2"></i>
  <section class="evt" hidden>
    <div class="orn">✦</div>
    <p class="fl" data-k="loc"></p>
    <p class="fd" data-k="date"></p>
  </section>
</header>

<section class="gh">
  <button class="vbtn" id="open"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Bagikan Kenangan</button>
  <h2>Galeri Kenangan</h2><small id="cnt"></small><i></i>
</section>
<main class="gal" id="gal"></main>
<p class="msg" id="emp" hidden>Belum ada kenangan. Jadilah yang pertama membagikan ✦</p>
<p class="msg" id="err" hidden>Galeri belum bisa dimuat. Memeriksa ulang otomatis…</p>

<footer>
  <p class="fc">Terima kasih telah menjadi bagian dari hari bahagia kami</p>
  <a class="adm" href="admin.html">~ with love ~</a>
</footer>
</div>

<div class="mask" id="mask">
  <div class="win" id="win" data-s="live" role="dialog" aria-modal="true" aria-label="Kamera">
    <div class="bar"><b>Bagikan Kenangan</b><button class="x" id="cx" aria-label="Tutup kamera">✕</button></div>
    <div class="view" id="view">
      <video id="v" playsinline muted autoplay></video><img id="pic" alt="Hasil foto">
      <div class="grid" id="grid"></div><div class="cd" id="cd"></div><div class="fl2" id="fl2"></div>
    </div>
    <div class="live">
      <div class="tools">
        <button id="tFlip">🔄 Putar kamera</button><button id="tRot">▯ Potret</button>
        <button id="tGrid">▦ Grid</button><button id="tTimer">⏱ Timer: mati</button>
      </div>
      <input type="range" id="zoom" aria-label="Zoom" hidden>
      <div class="shut"><button id="snap" aria-label="Ambil foto"></button></div>
    </div>
    <div class="rev">
      <input id="nm" placeholder="Nama Anda" maxlength="40" autocomplete="name" aria-label="Nama Anda">
      <input id="ps" placeholder="Pesan untuk mempelai (opsional)" maxlength="100" aria-label="Pesan">
      <div class="r"><button class="glass" id="redo">Ulangi</button><button class="glass p" id="snd">Bagikan</button></div>
    </div>
  </div>
</div>

<div class="lb" id="lb">
  <div class="stg" id="stg"><img class="sl" id="lp" alt=""><img class="sl" id="li" alt="Foto kenangan"><img class="sl" id="ln" alt=""></div>
  <button class="x" aria-label="Tutup">✕</button>
  <div class="lc" id="lc"><b></b><span></span></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="shared.js"></script>
<script>
const g=$('gal'),v=$('v'),V=$('view'),W=$('win'),M=$('mask');
let first=true,order=[],st=null,face='environment',land=false,grid=false,tm=0,shot=null,busy=false,pu='';
const PV=location.hash==='#preview'&&parent!==window; // dipakai sebagai pratinjau di halaman admin
let PVBG='';
if(PV)document.querySelector('.adm').onclick=e=>{e.preventDefault();toast('Ini pratinjau halaman tamu.')};
if(!PV){try{const c=JSON.parse(localStorage.getItem('cfg'));if(c)applyCfg(c)}catch(e){}}
else{
  addEventListener('message',e=>{
    if(e.source!==parent||!e.data||e.data.type!=='cfg')return;
    if(e.data.bg!==undefined)PVBG=e.data.bg;
    const c=e.data.cfg;c.bgData=c.bgId==='local'?PVBG:'';applyCfg(c);
  });
  parent.postMessage({type:'ready'},'*');
}

/* ===== Galeri (auto-update tiap 8 detik) ===== */
const RT=[1.34,1,1.5,1.2,.8,1.25,1.4]; // rasio tinggi/lebar foto di grid (dipilih dari ID foto, jadi tetap sama tiap dibuka)
const NC=2,SPD=[15,11],MQS=12;         // jumlah kolom; kecepatan drift tiap kolom dan marquee teks (px/detik): sengaja super pelan
let sig='',bw=0,CW=178;
const hs=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h};
function mi(nm,ms,hid){
  const s=document.createElement('span');s.className='mi';if(hid)s.setAttribute('aria-hidden','true');
  const b=document.createElement('b');b.textContent=nm;s.append(b);
  if(ms){const i=document.createElement('i');i.textContent=ms;s.append(i)}
  const u=document.createElement('u');u.textContent='✦';s.append(u);return s;
}
function marq(p){ // bukan "cap": nama itu sudah dipakai shared.js untuk caption lightbox
  const nm=p.uploaderName||'Tamu',ms=p.pesan||'',c=document.createElement('div'),q=document.createElement('div'),t=document.createElement('div');
  c.className='cp';q.className='mq';t.className='mt';
  const d=Math.max(CW,nm.length*7.5+ms.length*5.6+40)/MQS; // lama satu putaran: jarak satu salinan teks / kecepatan
  t.style.animationDuration=d+'s';t.style.animationDelay=-(hs(p.fileId)%100)/100*d+'s'; // fase acak agar tiap foto tidak bergerak serempak
  t.append(mi(nm,ms),mi(nm,ms,true));q.append(t);c.append(q);return c;
}
function tile(p,h,main,d){
  const f=document.createElement('figure');f.className='ph';f.style.height=h+'px';f.style.setProperty('--d',d);
  const im=document.createElement('img');im.loading='lazy';im.alt=main?'Kenangan dari '+(p.uploaderName||'tamu'):'';setImg(im,thumbs(p.fileId,400));
  f.append(im,marq(p));
  const o=()=>lbOpen(order,order.findIndex(x=>x.fileId===p.fileId));
  f.onclick=o;
  if(main){f.tabIndex=0;f.onkeydown=e=>{if(e.key==='Enter')o()}} // salinan pengulang tidak ikut tab / pembaca layar
  return f;
}
// Susun ulang kolom. Dipanggil hanya bila daftar foto atau lebar layar berubah; posisi drift tiap kolom dipertahankan.
function build(){
  const ps=order,n=ps.length,cs=getComputedStyle(g),gap=parseFloat(cs.columnGap)||0;
  const cw=(g.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0)-gap*(NC-1))/NC; // lebar satu kartu
  const ph=[...g.querySelectorAll('.trk')].map(t=>{const a=t.getAnimations()[0];return a?(a.effect.getComputedTiming().progress||0):0});
  g.textContent='';g.style.height='';bw=g.clientWidth;CW=cw;
  if(!n||!(cw>0))return;
  const asc=[...ps].reverse(); // urutan unggah: foto ke-k selalu masuk kolom k%NC, jadi foto baru tidak mengacak kolom lain
  const cols=[...Array(NC).keys()].map(j=>{
    let l=asc.filter((_,k)=>k%NC===j).reverse(); // di dalam kolom, terbaru di atas
    if(!l.length)l=[ps[j%n]];                     // foto lebih sedikit dari kolom: kolom kosong diisi ulang agar grid tetap penuh
    const hh=l.map(p=>Math.round(cw*RT[(hs(p.fileId)+j)%RT.length])); // tinggi bulat (px): tanpa garis halus antar kartu
    return{l,hh,p:hh.reduce((a,b)=>a+b+gap,0)};  // panjang satu putaran = tinggi semua kartu + gap di bawah tiap kartu
  });
  const H=Math.max(460,Math.min(880,Math.max(...cols.map(c=>c.p)))); // tinggi jendela galeri menyesuaikan jumlah foto
  g.style.height=H+'px';
  cols.forEach((c,j)=>{
    const col=document.createElement('div'),trk=document.createElement('div'),k=Math.ceil(H/c.p)+1,dur=c.p/SPD[j];
    col.className='col';trk.className='trk '+(j%2?'dn':'up'); // kolom 1 naik, kolom 2 turun (bila 3 kolom: naik, turun, naik)
    trk.style.setProperty('--p',c.p+'px');trk.style.animationDuration=dur+'s';trk.style.animationDelay=-(ph[j]||0)*dur+'s';
    for(let r=0;r<k;r++){
      const cp=document.createElement('div');cp.className='cpy';
      c.l.forEach((p,i)=>cp.append(tile(p,c.hh[i],r===0,Math.min(i,8)+j)));
      trk.append(cp);
    }
    col.append(trk);g.append(col);
  });
}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(g.clientWidth!==bw)build()},200)});
function sync(ps){
  ps=ps.filter(p=>p.fileId).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));order=ps;
  const s=ps.map(p=>p.fileId).join(',');
  if(s!==sig){sig=s;build()}
  $('cnt').textContent=ps.length?ps.length+' kenangan terkumpul':'';
  $('emp').hidden=ps.length>0;first=false;
}
async function load(m){
  try{
    const r=await(await fetch(API,{cache:'no-store'})).json();
    if(r.config&&!PV){applyCfg(r.config);try{localStorage.setItem('cfg',JSON.stringify(r.config))}catch(e){}}
    sync(r.photos||[]);$('err').hidden=true;
  }catch(e){if(first)$('err').hidden=false;else if(m)toast('Gagal menyegarkan galeri')}
}
load();setInterval(()=>{if(!document.hidden)load()},8000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});

/* ===== Kamera (hanya foto) ===== */
const stop=()=>{if(st){st.getTracks().forEach(t=>t.stop());st=null}v.srcObject=null};
async function start(){
  stop();
  try{
    const c={video:{facingMode:{ideal:face},width:{ideal:1920},height:{ideal:1080}},audio:false};
    try{st=await navigator.mediaDevices.getUserMedia(c)}
    catch(e){if(e.name!=='OverconstrainedError')throw e;st=await navigator.mediaDevices.getUserMedia({video:true})}
    v.srcObject=st;v.classList.toggle('mir',face==='user');await v.play();zinit();
  }catch(e){fail(e)}
}
function zinit(){
  const t=st.getVideoTracks()[0],c=t.getCapabilities?t.getCapabilities():{},z=$('zoom');
  if(c.zoom){z.min=c.zoom.min;z.max=c.zoom.max;z.step=c.zoom.step||.1;z.value=t.getSettings().zoom||c.zoom.min;z.hidden=false}else z.hidden=true;
}
$('zoom').oninput=e=>{try{st.getVideoTracks()[0].applyConstraints({advanced:[{zoom:+e.target.value}]}).catch(()=>{})}catch(x){}};
function fail(e){
  closeCam();
  toast(({NotAllowedError:'Izin kamera ditolak. Aktifkan izin kamera di pengaturan browser.',NotFoundError:'Kamera tidak ditemukan di perangkat ini.',NotReadableError:'Kamera sedang dipakai aplikasi lain.'})[e.name]||'Kamera tidak dapat dibuka.');
}
function openCam(){
  if(PV)return toast('Mode pratinjau: kamera hanya aktif di halaman tamu.');
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast('Kamera membutuhkan koneksi HTTPS.');
  try{$('nm').value=localStorage.getItem('nama')||''}catch(e){}
  $('ps').value='';W.dataset.s='live';M.classList.add('on');document.body.style.overflow='hidden';$('cx').focus();start();
}
function closeCam(){busy=false;stop();M.classList.remove('on');document.body.style.overflow='';$('cd').textContent=''}
function review(b){URL.revokeObjectURL(pu);pu=URL.createObjectURL(b);$('pic').src=pu;W.dataset.s='review';stop()}
async function shoot(){
  if(!st||busy)return;busy=true;
  for(let i=tm;i>0;i--){$('cd').textContent=i;await new Promise(r=>setTimeout(r,1000));if(!busy)return}
  $('cd').textContent='';
  const vw=v.videoWidth,vh=v.videoHeight;if(!st||!vw){busy=false;return}
  const bx=V.getBoundingClientRect(),r=bx.width/bx.height;let sw=vw,sh=vw/r;if(sh>vh){sh=vh;sw=vh*r}
  const s=Math.min(1,1600/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*s);c.height=Math.round(sh*s);
  c.getContext('2d').drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,c.width,c.height);
  const f=$('fl2');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  c.toBlob(b=>{busy=false;if(b){shot=b;review(b)}},'image/jpeg',.9);
}
async function ip(){try{const r=await Promise.race([fetch('https://api.ipify.org?format=json'),new Promise((_,j)=>setTimeout(j,2500))]);return(await r.json()).ip}catch(e){return 'Tidak diketahui'}}
async function sendIt(){
  const n=$('nm').value.trim();
  if(!n){toast('Tulis nama Anda dulu ya');$('nm').focus();return}
  if(!shot)return;
  const b=$('snd');b.disabled=true;b.textContent='Mengirim…';
  try{
    try{localStorage.setItem('nama',n)}catch(e){}
    const fb=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(shot)});
    const j=await post({action:'upload',uploaderName:n,pesan:$('ps').value.trim(),ipAddress:await ip(),fileBase64:fb,mimeType:'image/jpeg',fileName:'kenangan_'+Date.now()+'.jpg'});
    if(!j.success)throw 0;
    closeCam();toast('Terima kasih! Kenangan Anda sudah dibagikan 💛');load();
  }catch(e){toast('Gagal mengirim. Periksa koneksi lalu coba lagi.')}
  b.disabled=false;b.textContent='Bagikan';
}
$('open').onclick=openCam;$('cx').onclick=()=>{closeCam();$('open').focus()};$('snap').onclick=shoot;$('snd').onclick=sendIt;
$('redo').onclick=()=>{W.dataset.s='live';start()};
$('tFlip').onclick=()=>{if(busy)return;face=face==='user'?'environment':'user';start()};
$('tRot').onclick=e=>{land=!land;V.classList.toggle('ls',land);e.target.textContent=land?'▭ Lanskap':'▯ Potret'};
$('tGrid').onclick=e=>{grid=!grid;$('grid').classList.toggle('on',grid);e.target.classList.toggle('on',grid)};
$('tTimer').onclick=e=>{tm=[0,3,5][([0,3,5].indexOf(tm)+1)%3];e.target.textContent='⏱ Timer: '+(tm?tm+' dtk':'mati');e.target.classList.toggle('on',!!tm)};
window.onEsc=()=>{if(M.classList.contains('on'))closeCam()};
</script>
</body>
